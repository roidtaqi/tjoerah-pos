publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: id.kakzaki.blue_thermal_printer
        pluginClass: BlueThermalPrinterPlugin
